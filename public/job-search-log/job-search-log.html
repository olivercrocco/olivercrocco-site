<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Log</title>
<!-- Brand fonts load when online; without internet the page falls back to system fonts and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0d2b45; --blue: #1d437e; --mid: #0075a6; --teal: #28b6c3; --teal-light: #abe2e8; --teal-wash: #e9f7f9;
  --bg: #f4f7f9; --card: #ffffff; --ink: #2b2b2b; --muted: #545454; --line: #d3dde4;
  --warn-bg: #fff4d6; --warn-line: #d9a400; --bad-bg: #fde4e1; --bad-line: #c0392b; --good-bg: #e3f3e6; --good-line: #2e7d32;
  --head-font: "Montserrat", "Avenir Next", "Segoe UI", Arial, sans-serif;
  --body-font: "Raleway", "Avenir Next", "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 18px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body-font); font-weight: 500; line-height: 1.55; }
header.top { background: linear-gradient(115deg, var(--navy) 0%, var(--navy) 45%, var(--blue) 80%, #1a6f8c 100%); color: #fff; padding: 22px 16px 20px; border-bottom: 4px solid var(--teal); }
header.top .inner { max-width: 780px; margin: 0 auto; }
header.top .eyebrow { margin: 0 0 4px; font-family: var(--head-font); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--teal-light); }
header.top h1 { margin: 0; font-family: var(--head-font); font-weight: 900; font-size: 2rem; line-height: 1.05; text-transform: uppercase; }
header.top h1 span { color: var(--teal); }
header.top p.sub { margin: 8px 0 0; font-size: 0.92rem; color: #e6eef4; }
main { max-width: 780px; margin: 0 auto; padding: 16px; }
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.progress .label { font-family: var(--head-font); font-weight: 700; color: var(--navy); }
.bar { flex: 1 1 200px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--mid), var(--teal)); }
select.jump { font-size: 0.9rem; padding: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--blue); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
h2 { margin: 0 0 8px; font-family: var(--head-font); font-weight: 800; font-size: 1.45rem; line-height: 1.2; color: var(--blue); }
h3 { margin: 20px 0 6px; font-family: var(--head-font); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mid); }
.help { color: var(--muted); font-size: 0.92rem; margin: 4px 0 12px; }
.tip { background: var(--teal-wash); border-left: 5px solid var(--teal); border-radius: 6px; padding: 10px 14px; font-size: 0.92rem; margin: 10px 0; color: var(--navy); }
label.field { display: block; margin: 12px 0 4px; font-weight: 700; color: var(--navy); }
input[type=text], input[type=date], input[type=time], select, textarea { width: 100%; font-size: 1rem; padding: 10px; border: 1px solid #8fa3b3; border-radius: 6px; background: #fff; color: var(--ink); font-family: inherit; }
textarea { min-height: 70px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--teal); outline-offset: 1px; border-color: var(--mid); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > div { flex: 1 1 150px; }
button { font-size: 0.95rem; font-family: var(--head-font); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 11px 22px; border-radius: 30px; border: 2px solid var(--mid); background: #fff; color: var(--blue); cursor: pointer; }
button:hover:not(:disabled) { background: var(--teal-wash); }
button.primary { background: var(--navy); border-color: var(--teal); color: var(--teal); }
button.primary:hover:not(:disabled) { background: var(--blue); color: #fff; }
button.small { font-size: 0.78rem; padding: 6px 14px; }
button.danger { border-color: var(--bad-line); color: var(--bad-line); }
a.gbtn { display: inline-block; font-family: var(--head-font); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 14px; border-radius: 30px; border: 2px solid var(--mid); color: var(--blue); text-decoration: none; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.speak { margin: 2px 0 10px; }
.entry { border: 1px solid var(--line); border-left: 5px solid var(--teal); border-radius: 8px; padding: 12px 14px; margin: 14px 0; background: #fafcfd; }
.entry-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.entry-head strong { font-family: var(--head-font); font-weight: 700; color: var(--navy); }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; }
.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; }
.msg { border-left: 5px solid; border-radius: 6px; padding: 10px 12px; margin: 8px 0; font-size: 0.96rem; }
.msg.bad { background: var(--bad-bg); border-color: var(--bad-line); }
.msg.warn { background: var(--warn-bg); border-color: var(--warn-line); }
.msg.good { background: var(--good-bg); border-color: var(--good-line); }
.big { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0; }
.big > div { flex: 1 1 180px; background: var(--teal-wash); border-radius: 10px; padding: 12px 14px; }
.big .n { font-family: var(--head-font); font-weight: 800; font-size: 1.6rem; color: var(--navy); }
.big .l { font-size: 0.88rem; color: var(--muted); }
ul.tight { margin: 6px 0; padding-left: 22px; }
ul.tight li { margin: 4px 0; }
.upcoming li b { color: var(--navy); }
table.log { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.log th, table.log td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: top; }
table.log th { font-family: var(--head-font); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid); }
.print-area { background: #fff; border: 1px solid var(--line); padding: 18px; font-family: "Times New Roman", Times, serif; color: #000; }
.print-area h4 { margin: 14px 0 6px; font-size: 13pt; }
.print-area .pa-title { font-size: 15pt; font-weight: bold; margin: 0 0 4px; }
.print-area table.log th { color: #000; font-family: "Times New Roman", Times, serif; }
.hidden { display: none; }
footer { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 8px 16px 24px; }
@media (max-width: 560px) { html { font-size: 17px; } .card { padding: 14px; } table.log { font-size: 0.8rem; } }
@media print {
  body { background: #fff; }
  header.top, .progress, footer, .no-print { display: none !important; }
  .card { border: none; padding: 0; }
  .card > :not(.print-area) { display: none !important; }
  .print-area { border: none; padding: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <p class="eyebrow">Employment Skills Course</p>
    <h1>Job Search <span>Log</span></h1>
    <p class="sub">Keep a record of every job you apply for and who to follow up with. Nothing you type leaves this device.</p>
  </div>
</header>
<main>
  <div class="progress no-print" id="progress"></div>
  <div id="app"></div>
</main>
<footer class="no-print">Built for formerly incarcerated individuals and the programs that support them. Version 1, November 2026.</footer>

<script id="core">
function t(v) { return (v === undefined || v === null) ? "" : String(v).trim(); }
var APPT_TYPES = {
  checkin: "Parole check-in", drug: "Drug test", program: "Class or treatment", court: "Court date",
  interview: "Job interview", office: "Office visit (ID, Social Security, benefits)", work: "Work shift", other: "Something else"
};
var REPEATS = {
  none: "Does not repeat", weekly: "Every week", biweekly: "Every two weeks",
  monthlyDay: "Every month, same weekday (like the first Monday)", monthlyDate: "Every month, same date (like the 15th)"
};
var HOW = ["Online", "In person", "By phone", "By email", "Referral from someone", "Job fair"];
var STATUSES = ["Applied", "Waiting to hear back", "Interview scheduled", "Offer", "Hired", "Not selected"];
var DONE_STATUSES = ["Hired", "Not selected"];
var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var DAY_CODES = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
var ORDINALS = { 1: "first", 2: "second", 3: "third", 4: "fourth", "-1": "last" };

var idSeq = 0;
function newId() { idSeq += 1; return "a" + Date.now().toString(36) + idSeq; }
function newAppt() { return { id: newId(), type: "checkin", title: "", date: "", time: "", duration: "60", place: "", bring: "", repeat: "none", until: "" }; }
function newJob() { return { id: newId(), date: isoDate(new Date()), employer: "", job: "", how: "Online", contact: "", status: "Applied", followUp: "", interviewDate: "", interviewTime: "", notes: "" }; }
function newState() { return { version: 1, keep: false, jobs: [] }; }
function mergeState(x) {
  var s = newState();
  if (!x || typeof x !== "object") return s;
  if (typeof x.keep === "boolean") s.keep = x.keep;
  if (Array.isArray(x.jobs)) s.jobs = x.jobs.map(function (j) { return Object.assign(newJob(), j || {}); });
  return s;
}

/* ---------- Dates ---------- */
function pad(n) { return (n < 10 ? "0" : "") + n; }
function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t(s)); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function niceDate(d) { return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }); }
function niceTime(s) {
  var m = /^(\d{1,2}):(\d{2})/.exec(t(s)); if (!m) return "";
  var hr = +m[1], ap = hr >= 12 ? "PM" : "AM"; hr = hr % 12 || 12;
  return hr + ":" + m[2] + " " + ap;
}
function nthOfMonth(d) { var n = Math.ceil(d.getDate() / 7); return n >= 5 ? -1 : n; }
function nthWeekday(year, month, weekday, n) {
  if (n === -1) { var last = new Date(year, month + 1, 0); return addDays(last, -((last.getDay() - weekday + 7) % 7)); }
  var first = new Date(year, month, 1);
  var d = 1 + ((weekday - first.getDay() + 7) % 7) + (n - 1) * 7;
  var x = new Date(year, month, d);
  return x.getMonth() === month ? x : null;
}
function describeRepeat(a) {
  var d = parseDate(a.date); if (!d || a.repeat === "none") return "";
  var until = parseDate(a.until), tail = until ? ", until " + until.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "";
  if (a.repeat === "weekly") return "Every " + DAY_NAMES[d.getDay()] + tail;
  if (a.repeat === "biweekly") return "Every other " + DAY_NAMES[d.getDay()] + tail;
  if (a.repeat === "monthlyDay") return "Every month on the " + ORDINALS[nthOfMonth(d)] + " " + DAY_NAMES[d.getDay()] + tail;
  if (a.repeat === "monthlyDate") return "Every month on day " + d.getDate() + tail;
  return "";
}
function apptTitle(a) { return t(a.title) || APPT_TYPES[a.type] || "Appointment"; }

/* Every date this appointment falls on between two dates (inclusive). */
function occurrences(a, from, to) {
  var start = parseDate(a.date); if (!start) return [];
  var until = parseDate(a.until), out = [], i;
  var end = until && until < to ? until : to;
  if (a.repeat === "none") return (start >= from && start <= end) ? [start] : [];
  if (a.repeat === "weekly" || a.repeat === "biweekly") {
    var step = a.repeat === "weekly" ? 7 : 14;
    for (i = 0; i < 600; i++) { var d = addDays(start, i * step); if (d > end) break; if (d >= from) out.push(d); }
    return out;
  }
  var n = nthOfMonth(start), wd = start.getDay();
  for (i = 0; i < 240; i++) {
    var y = start.getFullYear(), m = start.getMonth() + i;
    var dd = a.repeat === "monthlyDay" ? nthWeekday(y + Math.floor(m / 12), m % 12, wd, n) : new Date(y, m, start.getDate());
    if (a.repeat === "monthlyDate" && dd && dd.getDate() !== start.getDate()) dd = null;
    if (!dd) continue;
    if (dd > end) break;
    if (dd >= from) out.push(dd);
  }
  return out;
}
function upcoming(s, from, days) {
  var to = addDays(from, days), list = [];
  s.appts.forEach(function (a) { occurrences(a, from, to).forEach(function (d) { list.push({ date: d, appt: a }); }); });
  return list.sort(function (x, y) { return x.date - y.date || t(x.appt.time).localeCompare(t(y.appt.time)); });
}

/* ---------- Calendar file (iCalendar, .ics) ---------- */
function icsEscape(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function icsFold(line) {
  var out = [], cur = line;
  while (cur.length > 73) { out.push(cur.slice(0, 73)); cur = " " + cur.slice(73); }
  out.push(cur); return out.join("\r\n");
}
function compact(dateStr, timeStr) {
  var d = t(dateStr).replace(/-/g, "");
  return t(timeStr) ? d + "T" + t(timeStr).replace(":", "").slice(0, 4) + "00" : d;
}
function endOf(a) {
  var d = parseDate(a.date); if (!d) return "";
  if (!t(a.time)) return isoDate(addDays(d, 1)).replace(/-/g, "");
  var m = /^(\d{1,2}):(\d{2})/.exec(a.time), mins = (+m[1]) * 60 + (+m[2]) + (parseInt(a.duration, 10) || 60);
  var e = addDays(d, Math.floor(mins / 1440)); mins = mins % 1440;
  return isoDate(e).replace(/-/g, "") + "T" + pad(Math.floor(mins / 60)) + pad(mins % 60) + "00";
}
function rrule(a) {
  var d = parseDate(a.date); if (!d || a.repeat === "none") return "";
  var r = "";
  if (a.repeat === "weekly") r = "FREQ=WEEKLY";
  else if (a.repeat === "biweekly") r = "FREQ=WEEKLY;INTERVAL=2";
  else if (a.repeat === "monthlyDay") r = "FREQ=MONTHLY;BYDAY=" + nthOfMonth(d) + DAY_CODES[d.getDay()];
  else if (a.repeat === "monthlyDate") r = "FREQ=MONTHLY;BYMONTHDAY=" + d.getDate();
  if (parseDate(a.until)) r += ";UNTIL=" + t(a.until).replace(/-/g, "") + "T235959";
  return r;
}
function visibleTitle(s, a) { return s.plain ? "Appointment" : apptTitle(a); }
function buildIcs(s) {
  var now = new Date(), stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + "T" + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + "Z";
  var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Reentry Toolkit//Job Search Log//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  s.appts.filter(function (a) { return parseDate(a.date); }).forEach(function (a) {
    var timed = !!t(a.time);
    var desc = [s.plain ? apptTitle(a) : "", t(a.bring) ? "Bring: " + t(a.bring) : ""].filter(Boolean).join("\n");
    L.push("BEGIN:VEVENT", "UID:" + a.id + "@reentry-toolkit", "DTSTAMP:" + stamp,
      (timed ? "DTSTART:" : "DTSTART;VALUE=DATE:") + compact(a.date, a.time),
      (timed ? "DTEND:" : "DTEND;VALUE=DATE:") + endOf(a),
      "SUMMARY:" + icsEscape(visibleTitle(s, a)));
    if (t(a.place)) L.push("LOCATION:" + icsEscape(a.place));
    if (desc) L.push("DESCRIPTION:" + icsEscape(desc));
    var r = rrule(a); if (r) L.push("RRULE:" + r);
    [["-P1D", "Tomorrow"], ["-PT1H", "In one hour"]].forEach(function (al) {
      L.push("BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:" + al[0], "DESCRIPTION:" + icsEscape(al[1] + ": " + visibleTitle(s, a)), "END:VALARM");
    });
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n") + "\r\n";
}
function googleLink(s, a) {
  if (!parseDate(a.date)) return "";
  var p = ["action=TEMPLATE", "text=" + encodeURIComponent(visibleTitle(s, a)), "dates=" + compact(a.date, a.time) + "/" + endOf(a)];
  if (t(a.place)) p.push("location=" + encodeURIComponent(a.place));
  var desc = [s.plain ? apptTitle(a) : "", t(a.bring) ? "Bring: " + t(a.bring) : ""].filter(Boolean).join("\n");
  if (desc) p.push("details=" + encodeURIComponent(desc));
  var r = rrule(a); if (r) p.push("recur=" + encodeURIComponent("RRULE:" + r));
  return "https://calendar.google.com/calendar/render?" + p.join("&");
}

/* ---------- Job search log ---------- */
function weekStart(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
function jobSummary(s, today) {
  var ws = weekStart(today), we = addDays(ws, 6);
  var real = s.jobs.filter(function (j) { return t(j.employer) || t(j.job); });
  var thisWeek = real.filter(function (j) { var d = parseDate(j.date); return d && d >= ws && d <= we; }).length;
  var due = real.filter(function (j) { var f = parseDate(j.followUp); return f && f <= today && DONE_STATUSES.indexOf(j.status) === -1; });
  var interviews = real.filter(function (j) { return j.status === "Interview scheduled"; }).length;
  return { total: real.length, thisWeek: thisWeek, due: due, interviews: interviews, weekLabel: ws.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " to " + we.toLocaleDateString("en-US", { month: "short", day: "numeric" }) };
}
function interviewAppt(j) {
  var a = newAppt();
  a.type = "interview"; a.title = "Interview at " + (t(j.employer) || "employer");
  a.date = j.interviewDate; a.time = j.interviewTime; a.place = t(j.employer); a.bring = "Copies of my resume, ID, and a pen";
  return a;
}
/* A calendar file holding just this interview. */
function interviewIcs(j) { return buildIcs({ plain: false, appts: [interviewAppt(j)] }); }

/* ---------- Example (a made-up person; dates are set from today) ---------- */
function exampleWork() {
  var today = new Date(), s = newState();
  function J(o) { return Object.assign(newJob(), o); }
  s.jobs = [
    J({ date: isoDate(addDays(today, -9)), employer: "Bayou Air Services", job: "HVAC Helper", how: "Online", contact: "", status: "Not selected", notes: "They hired someone with a license." }),
    J({ date: isoDate(addDays(today, -6)), employer: "Capital Area Property Services", job: "Maintenance Technician", how: "In person", contact: "Ms. Green", status: "Waiting to hear back", followUp: isoDate(addDays(today, -1)), notes: "Call back to check on my application." }),
    J({ date: isoDate(addDays(today, -4)), employer: "Gulf Mechanical", job: "HVAC Technician", how: "Referral from someone", contact: "Mr. Davis", status: "Interview scheduled", interviewDate: isoDate(addDays(today, 5)), interviewTime: "14:00", notes: "My instructor referred me." }),
    J({ date: isoDate(addDays(today, -2)), employer: "Riverside Apartments", job: "Maintenance Worker", how: "Online", contact: "", status: "Applied", followUp: isoDate(addDays(today, 5)) }),
    J({ date: isoDate(today), employer: "Delta Supply Warehouse", job: "Warehouse Worker", how: "Job fair", contact: "Front desk", status: "Applied", followUp: isoDate(addDays(today, 7)) })
  ];
  return s;
}
</script>

<script id="ui">
var state = newState();
var step = 0, dirty = false;
var STEPS = [
  { id: "start", title: "Start" },
  { id: "jobs", title: "Your job search" },
  { id: "print", title: "Print and save" }
];
var STORE_KEY = "reentry-job-search-log";
function h(s) { return String(s === undefined || s === null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function getPath(p) { return p.split(".").reduce(function (o, k) { return o == null ? undefined : o[k]; }, state); }
function setPath(p, v) { var k = p.split("."), o = state; for (var i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = v; changed(); }
function changed() { dirty = true; persist(); }
function persist() {
  try { if (state.keep) localStorage.setItem(STORE_KEY, JSON.stringify(state)); else localStorage.removeItem(STORE_KEY); } catch (e) {}
}
function restore() {
  try { var raw = localStorage.getItem(STORE_KEY); if (raw) { var s = mergeState(JSON.parse(raw)); if (s.keep) { state = s; return true; } } } catch (e) {}
  return false;
}
function inp(path, type, extra) {
  return '<input type="' + (type || "text") + '" data-bind="' + path + '" value="' + h(getPath(path)) + '"' + (extra || "") + ">";
}
function field(label, path, type, extra, help) {
  return '<label class="field">' + h(label) + "</label>" + (help ? '<div class="help">' + help + "</div>" : "") + inp(path, type, extra);
}
function select(path, options, labels) {
  var v = getPath(path);
  return '<select data-bind="' + path + '" data-rerender="1">' + options.map(function (o, i) {
    return '<option value="' + h(o) + '"' + (v === o ? " selected" : "") + ">" + h(labels ? labels[i] : o) + "</option>";
  }).join("") + "</select>";
}
function renderProgress() {
  var pct = Math.round((step / (STEPS.length - 1)) * 100);
  document.getElementById("progress").innerHTML =
    '<span class="label">Step ' + (step + 1) + " of " + STEPS.length + ": " + h(STEPS[step].title) + "</span>" +
    '<div class="bar" aria-hidden="true"><div style="width:' + pct + '%"></div></div>' +
    '<select class="jump" data-action="jump" aria-label="Go to step">' +
    STEPS.map(function (s, i) { return '<option value="' + i + '"' + (i === step ? " selected" : "") + ">" + (i + 1) + ". " + h(s.title) + "</option>"; }).join("") + "</select>";
}
function nav() {
  return '<div class="nav no-print">' + (step > 0 ? '<button data-action="prev">Back</button>' : "<span></span>") +
    (step < STEPS.length - 1 ? '<button class="primary" data-action="next">Next</button>' : "<span></span>") + "</div>";
}
function stepStart() {
  return '<div class="card"><h2>Keep track of your job search</h2>' +
    "<p>Add a line for every job you apply for. The log shows how many you applied for this week, reminds you who to follow up with, and prints a record you can show your parole officer or program if they ask for one.</p>" +
    '<div class="tip">Privacy: everything stays on this device. Nothing is sent over the internet.</div>' +
    "<h3>Keeping your work</h3>" +
    '<label class="check"><input type="checkbox" data-action="keep"' + (state.keep ? " checked" : "") + "> <span>Keep my work on this device. Only check this on your own phone or computer, not a shared one.</span></label>" +
    '<div class="help">If you leave this unchecked, use \u201CSave my work\u201D on the last step to keep a file you can open next time.</div>' +
    '<div class="actions"><button class="primary" data-action="next">Start</button><button data-action="tryExample">Try it with an example</button><button data-action="openFile">Open saved work</button>' +
    '<input type="file" id="loadFile" accept=".json,application/json" class="hidden"></div><div id="loadMsg"></div></div>';
}
function jobCard(j, i) {
  var p = "jobs." + i;
  var html = '<div class="entry"><div class="entry-head"><strong>' + h(t(j.employer) || "New application") + (t(j.job) ? ": " + h(j.job) : "") + "</strong>" +
    '<button class="small danger" data-action="removeJob" data-i="' + i + '">Remove</button></div>' +
    '<div class="row"><div>' + field("Date you applied", p + ".date", "date") + "</div><div>" + '<label class="field">How you applied</label>' + select(p + ".how", HOW) + "</div></div>" +
    '<div class="row"><div>' + field("Employer", p + ".employer") + "</div><div>" + field("Job", p + ".job") + "</div></div>" +
    field("Person you talked to (optional)", p + ".contact") +
    '<div class="row"><div><label class="field">Where it stands</label>' + select(p + ".status", STATUSES) + "</div>" +
    "<div>" + field("Follow up on (optional)", p + ".followUp", "date") + "</div></div>";
  if (j.status === "Interview scheduled") {
    html += '<div class="row"><div>' + field("Interview date", p + ".interviewDate", "date") + "</div><div>" + field("Interview time", p + ".interviewTime", "time") + "</div></div>" +
      '<div class="actions"><button class="small" data-action="interviewIcs" data-i="' + i + '"' + (parseDate(j.interviewDate) ? "" : " disabled") + ">Add this interview to my phone\u2019s calendar</button></div>" +
      '<p class="help">This makes a calendar file with a reminder the day before and one hour before. Open it on your phone to add it.</p>';
  }
  html += field("Notes (optional)", p + ".notes", "text", ' placeholder="What happened, who to call back"');
  return html + "</div>";
}
function stepJobs() {
  var sum = jobSummary(state, new Date());
  var html = '<div class="card"><h2>Your job search</h2>' +
    '<div class="help">Add a line for every job you apply for. It helps you remember who to call back, and it gives you a record to show your parole officer or program if they ask for one.</div>' +
    '<div class="big"><div><div class="n">' + sum.thisWeek + '</div><div class="l">applications this week (' + h(sum.weekLabel) + ")</div></div>" +
    '<div><div class="n">' + sum.total + '</div><div class="l">applications in all</div></div>' +
    '<div><div class="n">' + sum.interviews + '</div><div class="l">interviews scheduled</div></div></div>';
  if (sum.due.length) html += '<div class="msg warn">Time to follow up with: ' + sum.due.map(function (j) { return h(j.employer); }).join(", ") + ".</div>";
  state.jobs.forEach(function (j, i) { html += jobCard(j, i); });
  if (!state.jobs.length) html += '<p class="help">No applications yet.</p>';
  html += '<div class="actions"><button data-action="addJob">Add an application</button></div>';
  return html + nav() + "</div>";
}
function printAreaHtml() {
  var today = new Date();
  var html = '<div class="print-area"><p class="pa-title">My job search log</p><p>Printed ' + h(today.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })) + "</p>";
  var jobs = state.jobs.filter(function (j) { return t(j.employer) || t(j.job); }).slice().sort(function (x, y) { return t(x.date).localeCompare(t(y.date)); });
  if (!jobs.length) return html + "<p>No applications yet.</p></div>";
  html += '<table class="log"><thead><tr><th>Date</th><th>Employer</th><th>Job</th><th>How</th><th>Contact</th><th>Status</th></tr></thead><tbody>' +
    jobs.map(function (j) {
      var d = parseDate(j.date);
      return "<tr><td>" + h(d ? d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "") + "</td><td>" + h(j.employer) + "</td><td>" + h(j.job) + "</td><td>" + h(j.how) + "</td><td>" + h(j.contact) + "</td><td>" + h(j.status) + "</td></tr>";
    }).join("") + "</tbody></table>";
  return html + "</div>";
}
function stepPrint() {
  return '<div class="card"><h2>Print and save</h2>' +
    '<div class="help">Print your log to keep with your papers or to show your parole officer or program, or save your work to open again next time.</div>' +
    '<div class="actions no-print"><button class="primary" data-action="print">Print</button><button data-action="save">Save my work</button><button class="danger" data-action="clear">Clear everything</button></div>' +
    '<div class="tip no-print">On a shared computer, use \u201CClear everything\u201D when you finish, and delete any file you saved.</div>' +
    printAreaHtml() + nav() + "</div>";
}

/* ----- Read aloud ----- */
var canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
var speaking = false;
function stopSpeaking() { if (canSpeak) window.speechSynthesis.cancel(); speaking = false; var b = document.getElementById("speakBtn"); if (b) b.textContent = "\uD83D\uDD0A Read this to me"; }
function speakCard() {
  if (!canSpeak) return;
  if (speaking) { stopSpeaking(); return; }
  var card = document.querySelector("#app .card"), parts = [];
  card.querySelectorAll("h2, h3, p, li, .help, .tip, label.field, label.check span, .msg, .big > div").forEach(function (el) {
    if (el.closest("#speakBtn, .print-area")) return;
    var x = (el.innerText || "").replace(/\s+/g, " ").trim();
    if (x && parts.indexOf(x) === -1) parts.push(x);
  });
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(parts.join(". ").replace(/\.\./g, "."));
  var voices = window.speechSynthesis.getVoices() || [];
  var v = voices.filter(function (x) { return /^en(-|_)US/i.test(x.lang) && x.localService; })[0] || voices.filter(function (x) { return /^en(-|_)US/i.test(x.lang); })[0];
  if (v) u.voice = v;
  u.rate = 0.9;
  u.onend = u.onerror = function () { speaking = false; var b = document.getElementById("speakBtn"); if (b) b.textContent = "\uD83D\uDD0A Read this to me"; };
  window.speechSynthesis.speak(u); speaking = true;
  document.getElementById("speakBtn").textContent = "\u25A0 Stop reading";
}
function addSpeakButton() {
  if (!canSpeak) return;
  var h2 = document.querySelector("#app .card h2"); if (!h2) return;
  var b = document.createElement("button");
  b.id = "speakBtn"; b.className = "small speak no-print"; b.setAttribute("data-action", "speak");
  b.textContent = "\uD83D\uDD0A Read this to me";
  h2.insertAdjacentElement("afterend", b);
}

/* ----- Step examples: fill this step's boxes with a made-up person's answers (undoable) ----- */
var filledSteps = {};
function stepKeys(id) { return ({ jobs: ["jobs"] })[id] || null; }
function getP(o, p) { return p.split(".").reduce(function (x, k) { return x == null ? undefined : x[k]; }, o); }
function setP(o, p, v) { var k = p.split("."), x = o; for (var i = 0; i < k.length - 1; i++) x = x[k[i]]; x[k[k.length - 1]] = v; }
function cloneV(v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); }
function fillStepExample() {
  var id = STEPS[step].id, keys = stepKeys(id); if (!keys) return;
  if (filledSteps[id]) {
    var saved = filledSteps[id];
    keys.forEach(function (p, i) { setP(state, p, cloneV(saved[i])); });
    delete filledSteps[id]; changed(); rerender(); return;
  }
  var blank = newState(), E = exampleWork();
  var own = keys.some(function (p) { return JSON.stringify(getP(state, p)) !== JSON.stringify(getP(blank, p)); });
  if (own && !confirm("Fill this step with the example? Your own entries on this step will be replaced for now. You can bring them back with \u201CRemove the example.\u201D")) return;
  filledSteps[id] = keys.map(function (p) { return cloneV(getP(state, p)); });
  keys.forEach(function (p) { setP(state, p, cloneV(getP(E, p))); });
  changed(); rerender();
}
function addExampleButton() {
  if (exampleMode) return;
  var id = STEPS[step].id; if (!stepKeys(id)) return;
  var anchor = document.getElementById("speakBtn") || document.querySelector("#app .card h2"); if (!anchor) return;
  var b = document.createElement("button");
  b.className = "small speak no-print"; b.setAttribute("data-action", "toggleStepExample");
  b.style.marginLeft = anchor.id === "speakBtn" ? "8px" : "0";
  b.textContent = filledSteps[id] ? "Remove the example" : "See an example";
  anchor.insertAdjacentElement("afterend", b);
  if (filledSteps[id]) {
    var note = document.createElement("div");
    note.className = "msg warn no-print";
    note.textContent = "Example entries from a made-up person are filled in below. Change them to your own, or tap \u201CRemove the example\u201D to bring back what you had.";
    b.insertAdjacentElement("afterend", note);
  }
}

/* ----- Example mode ----- */
var exampleMode = false;
function exampleBanner() {
  if (!exampleMode) return;
  document.getElementById("app").insertAdjacentHTML("afterbegin",
    '<div class="msg warn no-print" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">' +
    "<span>You are looking at a made-up example. Use Back and Next to see every step filled in, and change anything you like.</span>" +
    '<button class="small" data-action="endExample">Start my own</button></div>');
}
function startExample() {
  if (dirty && !confirm("Replace what you entered with the example? Save your work first if you want to keep it.")) return;
  var keep = state.keep; state = exampleWork(); state.keep = false; exampleMode = true; filledSteps = {}; dirty = false;
  if (keep) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
  goTo(1);
}
function endExample() {
  if (!confirm("Clear the example and start your own?")) return;
  state = newState(); exampleMode = false; filledSteps = {}; dirty = false; persist(); goTo(1);
}

function render() {
  renderProgress();
  var id = STEPS[step].id, html;
  if (id === "start") html = stepStart();
  else if (id === "jobs") html = stepJobs();
  else html = stepPrint();
  document.getElementById("app").innerHTML = html;
  addSpeakButton();
  addExampleButton();
  exampleBanner();
}
function rerender() { var y = window.scrollY; render(); window.scrollTo(0, y); }
function goTo(n) { stopSpeaking(); step = Math.max(0, Math.min(STEPS.length - 1, n)); render(); window.scrollTo(0, 0); }
function download(data, name, mime) {
  var url = URL.createObjectURL(new Blob([data], { type: mime }));
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

document.addEventListener("input", function (ev) {
  var p = ev.target.getAttribute("data-bind");
  if (p && ev.target.tagName !== "SELECT") setPath(p, ev.target.value);
});
document.addEventListener("change", function (ev) {
  var el = ev.target, a = el.getAttribute("data-action");
  if (a === "jump") { goTo(parseInt(el.value, 10)); return; }
  if (a === "keep") { state.keep = el.checked; persist(); return; }
  var p = el.getAttribute("data-bind");
  if (p && el.tagName === "SELECT") { setPath(p, el.value); if (el.getAttribute("data-rerender")) rerender(); return; }
  if (p && (el.type === "date" || el.type === "time")) { setPath(p, el.value); rerender(); return; }
  if (el.id === "loadFile" && el.files && el.files[0]) {
    var fr = new FileReader();
    fr.onload = function () {
      try { var keep = state.keep; state = mergeState(JSON.parse(fr.result)); state.keep = keep; exampleMode = false; filledSteps = {}; dirty = false; persist(); goTo(1); }
      catch (e) { document.getElementById("loadMsg").innerHTML = '<div class="msg bad">That file could not be opened. Choose a file saved by this tool.</div>'; }
    };
    fr.readAsText(el.files[0]);
  }
});
document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-action]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  var i = parseInt(el.getAttribute("data-i"), 10);
  switch (el.getAttribute("data-action")) {
    case "next": goTo(step + 1); break;
    case "prev": goTo(step - 1); break;
    case "speak": speakCard(); break;
    case "openFile": document.getElementById("loadFile").click(); break;
    case "tryExample": startExample(); break;
    case "endExample": endExample(); break;
    case "toggleStepExample": fillStepExample(); break;
    case "addJob": state.jobs.unshift(newJob()); changed(); rerender(); break;
    case "removeJob": if (confirm("Remove this application?")) { state.jobs.splice(i, 1); changed(); rerender(); } break;
    case "interviewIcs": var job = state.jobs[i]; download(interviewIcs(job), "Interview at " + (t(job.employer) || "employer").replace(/[^A-Za-z0-9 .'-]/g, "") + ".ics", "text/calendar;charset=utf-8"); break;
    case "print": window.print(); break;
    case "save": download(JSON.stringify(state, null, 2), "Job Search Log (saved work).json", "application/json"); dirty = false; break;
    case "clear":
      if (confirm("Clear everything you entered on this device? Save your work first if you want to keep it.")) {
        state = newState(); exampleMode = false; filledSteps = {}; dirty = false;
        try { localStorage.removeItem(STORE_KEY); } catch (e) {}
        goTo(0);
      }
      break;
  }
});
window.addEventListener("beforeunload", function (ev) { if (dirty && !state.keep) { ev.preventDefault(); ev.returnValue = ""; } });
restore();
render();
</script>
</body>
</html>
