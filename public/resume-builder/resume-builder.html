<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Builder</title>
<!-- Brand fonts load when online; without internet the page falls back to system fonts and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Palette taken from the partner organization's website, November 2026. */
  --navy: #0d2b45;
  --blue: #1d437e;
  --mid: #0075a6;
  --teal: #28b6c3;
  --teal-light: #abe2e8;
  --teal-wash: #e9f7f9;
  --bg: #f4f7f9;
  --card: #ffffff;
  --ink: #2b2b2b;
  --muted: #545454;
  --line: #d3dde4;
  --accent: #1d437e;
  --accent-ink: #ffffff;
  --soft: #e9f7f9;
  --head-font: "Montserrat", "Avenir Next", "Segoe UI", Arial, sans-serif;
  --body-font: "Raleway", "Avenir Next", "Segoe UI", Arial, sans-serif;
  --warn-bg: #fff4d6;
  --warn-line: #d9a400;
  --bad-bg: #fde4e1;
  --bad-line: #c0392b;
  --good-bg: #e3f3e6;
  --good-line: #2e7d32;
}
* { box-sizing: border-box; }
html { font-size: 18px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body-font);
  font-weight: 500;
  line-height: 1.55;
}
header.top {
  background: linear-gradient(115deg, var(--navy) 0%, var(--navy) 45%, var(--blue) 80%, #1a6f8c 100%);
  color: #fff;
  padding: 22px 16px 20px;
  border-bottom: 4px solid var(--teal);
}
header.top .inner { max-width: 780px; margin: 0 auto; }
header.top .eyebrow {
  margin: 0 0 4px;
  font-family: var(--head-font);
  font-weight: 600;
  font-size: 0.75rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--teal-light);
}
header.top h1 {
  margin: 0;
  font-family: var(--head-font);
  font-weight: 900;
  font-size: 2rem;
  line-height: 1.05;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
header.top h1 span { color: var(--teal); }
header.top p.sub { margin: 8px 0 0; font-size: 0.92rem; color: #e6eef4; }
main { max-width: 780px; margin: 0 auto; padding: 16px; }
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.progress .label { font-family: var(--head-font); font-weight: 700; color: var(--navy); }
.bar { flex: 1 1 200px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--mid), var(--teal)); }
select.jump { font-size: 0.9rem; padding: 6px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 4px solid var(--blue);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
}
h2 {
  margin: 0 0 8px;
  font-family: var(--head-font);
  font-weight: 800;
  font-size: 1.45rem;
  line-height: 1.2;
  color: var(--blue);
}
h3 {
  margin: 20px 0 6px;
  font-family: var(--head-font);
  font-weight: 700;
  font-size: 0.82rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mid);
}
.help { color: var(--muted); font-size: 0.92rem; margin: 4px 0 12px; }
.tip {
  background: var(--teal-wash);
  border-left: 5px solid var(--teal);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 0.92rem;
  margin: 10px 0;
  color: var(--navy);
}
label.field { display: block; margin: 14px 0 4px; font-weight: 700; color: var(--navy); }
input[type=text], input[type=tel], input[type=email], select, textarea {
  width: 100%;
  font-size: 1rem;
  padding: 10px;
  border: 1px solid #8fa3b3;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font-family: inherit;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 3px solid var(--teal);
  outline-offset: 1px;
  border-color: var(--mid);
}
textarea { min-height: 110px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > div { flex: 1 1 160px; }
button {
  font-size: 0.95rem;
  font-family: var(--head-font);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 11px 22px;
  border-radius: 30px;
  border: 2px solid var(--mid);
  background: #fff;
  color: var(--blue);
  cursor: pointer;
}
button:hover:not(:disabled) { background: var(--teal-wash); }
button.primary { background: var(--navy); border-color: var(--teal); color: var(--teal); }
button.primary:hover:not(:disabled) { background: var(--blue); color: #fff; }
button.small { font-size: 0.78rem; padding: 6px 14px; }
button.danger { border-color: var(--bad-line); color: var(--bad-line); }
button:disabled { opacity: 0.5; cursor: default; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }
.entry { border: 1px solid var(--line); border-left: 5px solid var(--teal); border-radius: 8px; padding: 14px; margin: 14px 0; background: #fafcfd; }
.entry-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.entry-head strong { font-family: var(--head-font); font-weight: 700; font-size: 1.05rem; color: var(--navy); }
.bullet-row { display: flex; gap: 8px; margin: 6px 0; align-items: center; }
.bullet-row input, .bullet-row textarea { flex: 1; }
textarea.line { min-height: 0; resize: vertical; }
.suggest { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; font-size: 0.95rem; }
.suggest span { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.chip {
  border-radius: 18px;
  padding: 6px 14px;
  font-family: var(--body-font);
  font-weight: 600;
  font-size: 0.92rem;
  letter-spacing: 0;
  text-transform: none;
  border-width: 1.5px;
}
.chip[aria-pressed=true] { background: var(--blue); border-color: var(--blue); color: #fff; }
.chip[aria-pressed=true]::before { content: "\2713  "; color: var(--teal-light); }
details.group { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: #fafcfd; }
details.group > summary {
  cursor: pointer;
  padding: 12px 14px;
  font-family: var(--head-font);
  font-weight: 700;
  color: var(--navy);
  list-style-position: inside;
}
details.group[open] > summary { border-bottom: 1px solid var(--line); }
details.group > .chips, details.group > .quick, details.group > .help { padding: 0 14px; }
details.group > .chips, details.group > .quick { padding-bottom: 12px; }
details.group > .help { margin-top: 10px; }
details.group .count {
  margin-left: 6px;
  font-family: var(--body-font);
  font-size: 0.8rem;
  font-weight: 700;
  color: #fff;
  background: var(--mid);
  border-radius: 10px;
  padding: 2px 8px;
}
.check { display: flex; gap: 10px; align-items: center; margin: 10px 0; font-weight: 600; }
.check input { width: 22px; height: 22px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.quick button { text-transform: none; letter-spacing: 0; font-family: var(--body-font); font-weight: 700; font-size: 0.88rem; }
.msg { border-left: 5px solid; border-radius: 6px; padding: 8px 12px; margin: 6px 0; font-size: 0.95rem; }
.msg.bad { background: var(--bad-bg); border-color: var(--bad-line); }
.msg.warn { background: var(--warn-bg); border-color: var(--warn-line); }
.msg.good { background: var(--good-bg); border-color: var(--good-line); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.preview-box {
  background: #fff;
  border: 1px solid var(--line);
  padding: 32px 36px;
  font-family: "Times New Roman", Times, serif;
  font-size: 12pt;
  line-height: 1.2;
  color: #000;
  overflow-wrap: anywhere;
}
.preview-box p { margin: 0; }
.preview-box .name { text-align: center; font-weight: bold; font-size: 16pt; }
.preview-box .contact { text-align: center; }
.preview-box .sec { font-weight: bold; border-bottom: 1px solid #000; margin-top: 12pt; }
.preview-box .b { font-weight: bold; }
.preview-box ul { margin: 0; padding-left: 18pt; }
.preview-box .gap { height: 8pt; }
.kw { display: inline-block; border-radius: 14px; padding: 3px 10px; margin: 3px; font-size: 0.88rem; border: 1px solid; }
.kw.yes { background: var(--good-bg); border-color: var(--good-line); }
.kw.no { background: var(--warn-bg); border-color: var(--warn-line); }
.example-box { border: 2px dashed var(--teal); background: var(--teal-wash); border-radius: 10px; padding: 12px 16px; margin: 4px 0 14px; color: var(--navy); }
.example-box .ex-title { margin: 0 0 6px; font-family: var(--head-font); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid); }
.example-box .ex-note { margin: 8px 0 0; font-size: 0.85rem; color: var(--muted); }
.example-box .ex-text { white-space: pre-wrap; }
.example-box dl { margin: 0; }
.example-box dt { font-weight: 700; margin-top: 6px; }
.example-box dd { margin: 0 0 2px; }
.example-box ul { margin: 4px 0; padding-left: 20px; }
.hidden { display: none; }
.speak { margin: 2px 0 10px; }
.example { margin-top: 14px; }
.example .preview-box { max-height: 520px; overflow-y: auto; }
textarea.letter { min-height: 360px; font-family: "Times New Roman", Times, serif; font-size: 1rem; line-height: 1.4; }
.letter-print { display: none; white-space: pre-wrap; font-family: "Times New Roman", Times, serif; font-size: 12pt; line-height: 1.2; color: #000; }
ul.steplist { list-style: none; padding: 0; margin: 6px 0 10px; }
ul.steplist li { display: flex; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); }
ul.steplist .ok, ul.steplist .opt, ul.steplist .todo {
  display: inline-block; min-width: 108px; font-size: 0.8rem; font-weight: 700; border-radius: 10px; padding: 2px 8px; text-align: center;
}
ul.steplist .ok { background: var(--good-bg); color: var(--good-line); }
ul.steplist .opt { background: var(--teal-wash); color: var(--mid); }
ul.steplist .todo { background: var(--warn-bg); color: #7a5a00; }
button.linkish {
  border: none; background: none; padding: 4px 0; color: var(--blue); text-decoration: underline;
  text-transform: none; letter-spacing: 0; font-family: var(--body-font); font-weight: 600; font-size: 0.95rem; border-radius: 0;
}
button.linkish:hover:not(:disabled) { background: none; color: var(--mid); }
footer { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 8px 16px 24px; }
@media (max-width: 520px) {
  html { font-size: 17px; }
  .card { padding: 14px; }
  .preview-box { padding: 18px 14px; }
}
@media print {
  body { background: #fff; }
  header.top, .progress, footer, .no-print, .card > :not(.print-area) { display: none !important; }
  main { padding: 0; max-width: none; }
  .card { border: none; padding: 0; margin: 0; }
  .print-area { display: block !important; }
  .preview-box { border: none; padding: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <p class="eyebrow">Employment Skills Course</p>
    <h1>Build Your <span>Resume</span></h1>

<footer class="no-print">Built for formerly incarcerated individuals and the programs that support them. Version 1, November 2026.</footer>

    volunteer: [],

  if (!loaded || typeof loaded !== "object") return s;
  ["contact", "goal", "summaryHelp", "letter"].forEach(function (k) {
    if (loaded[k] && typeof loaded[k] === "object") {
      Object.keys(s[k]).forEach(function (f) { if (loaded[k][f] !== undefined) s[k][f] = loaded[k][f]; });
    }
  });
  ["work", "volunteer", "certs", "education", "skills"].forEach(function (k) {
    if (Array.isArray(loaded[k])) s[k] = loaded[k];
  });
  if (typeof loaded.summary === "string") s.summary = loaded.summary;
  s.work = s.work.map(function (e) { return Object.assign(newEntry(), e, { bullets: Array.isArray(e.bullets) ? e.bullets : [] }); });
  s.volunteer = s.volunteer.map(function (e) { return Object.assign(newEntry(), e, { bullets: Array.isArray(e.bullets) ? e.bullets : [] }); });

  if (t(s.summary)) {

    o.push({ kind: "para", text: t(s.summary) });
  }
  var skills = s.skills.map(t).filter(Boolean);
  if (skills.length) {
    o.push({ kind: "heading", text: "SKILLS" });
    o.push({ kind: "para", text: skills.join(", ") });
  }
  var certs = s.certs.map(certLine).filter(Boolean);
  if (certs.length) {
    o.push({ kind: "heading", text: "CERTIFICATIONS AND TRAINING" });
    certs.forEach(function (c) { o.push({ kind: "bullet", text: c }); });
  }

    var real = list.filter(hasEntryContent);
    if (!real.length) return;
    o.push({ kind: "heading", text: heading });
    real.forEach(function (e, i) {
      if (i > 0) o.push({ kind: "blank" });
      if (t(e.title)) o.push({ kind: "bold", text: t(e.title) });
      var l2 = entryLine2(e);
      if (l2) o.push({ kind: "para", text: l2 });
      cleanBullets(e.bullets).forEach(function (b) { o.push({ kind: "bullet", text: b }); });
    });

  entries(s.work, "WORK EXPERIENCE");
  entries(s.volunteer, "VOLUNTEER AND LEADERSHIP");

  if (edu.length) {

    edu.forEach(function (ed, i) {
      if (i > 0) o.push({ kind: "blank" });
      var l1 = eduLine1(ed);
      if (l1) o.push({ kind: "bold", text: l1 });
      var l2 = eduLine2(ed);
      if (l2) o.push({ kind: "para", text: l2 });
      if (t(ed.detail)) o.push({ kind: "bullet", text: t(ed.detail) });
    });
  }
  return o;
}

/* ---------- Plain text ---------- */
function buildPlainText(s) {
  var lines = [];
  outline(s).forEach(function (item) {
    if (item.kind === "heading") { lines.push(""); lines.push(item.text); }
    else if (item.kind === "blank") lines.push("");
    else if (item.kind === "bullet") lines.push("- " + item.text);
    else lines.push(item.text);
  });

}

   Version 1 list: to be reviewed and extended with staff and clients, who know the local terms. */
var WORDING_RULES = [
  { re: /\binmates?\b/i, tip: "Say “people,” “peers,” or “residents” instead of “inmate.”" },
  { re: /\boffenders?\b/i, tip: "Say “people” or “participants” instead of “offender.”" },
  { re: /\bprisoners?\b/i, tip: "Say “people” or “peers” instead of “prisoner.”" },
  { re: /\bcounsel substitute\b/i, tip: "Employers will not know “counsel substitute.” Try “Legal Aide” or “Legal Research Assistant” and describe the work." },
  { re: /\b(DOC|D\.O\.C\.)\s*(#|no\.?|number)/i, tip: "Leave ID numbers off your resume." },
  { re: /\btier\s*walker\b/i, tip: "Employers will not know “tier walker.” Describe the tasks you did instead." },
  { re: /\bhall\s*man\b|\bhallman\b/i, tip: "Employers will not know “hall man.” Describe the tasks you did, for example cleaning or delivering supplies." },
  { re: /\btrust(y|ee) status\b|\btrusty\b/i, tip: "Employers may not know “trusty.” Say what it meant, for example “Trusted to work with little supervision.”" },
  { re: /\blifers?\b/i, tip: "Leave out “lifer.” Your resume is about your skills and work." },
  { re: /\bCTRP\b/, tip: "Employers will not know “CTRP.” Name the program or the certificate you earned instead." },
  { re: /\b(locked up|behind bars|doing time|state time|cell ?block|lock ?down)\b/i, tip: "Lines about your work do not need to mention prison. Your employer line already says where you worked." },
  { re: /\b(in|while in|at) (prison|the penitentiary|jail)\b|\bincarcerat/i, tip: "Lines about your work do not need to mention prison. Your employer line already says where you worked." }
];
var WEAK_STARTS = [
  { re: /^(I|I'm|I've|My|Me)\b/, tip: "Start with an action word instead of “I” or “My.” For example, “Repaired” instead of “I repaired.”" },
  { re: /^(responsible for|duties (included|were|:)|was responsible)/i, tip: "Start with what you did, not “Responsible for.” For example, “Managed” or “Kept.”" },
  { re: /^(was|were|did)\b/i, tip: "Start with a stronger action word, like “Prepared,” “Built,” or “Trained.”" }

function wordingIssues(s) {

  function excerpt(text) { var v = t(text); return v.length > 50 ? v.slice(0, 47) + "..." : v; }

    var seen = {};

    }
  }
  scan(s.summary, "Summary", false);
  s.work.concat(s.volunteer).forEach(function (e) {
    var where = t(e.title) || "A job";
    scan(e.title, where + " (job title)", false);
    cleanBullets(e.bullets).forEach(function (b) { scan(b, where, true); });

function allKeywords() {

/* ---------- Summary draft ---------- */
function joinNatural(items) {
  if (items.length <= 1) return items.join("");

/* ----- Read aloud (uses the device's own voices, which work offline) ----- */
var canSpeak = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
var speaking = false;
function pickVoice() {
  var voices = window.speechSynthesis.getVoices() || [];
  var en = voices.filter(function (v) { return /^en(-|_)US/i.test(v.lang); });
  return en.filter(function (v) { return v.localService; })[0] || en[0] || voices.filter(function (v) { return v.localService; })[0] || null;
}
function stopSpeaking() {
  if (canSpeak) window.speechSynthesis.cancel();
  speaking = false;
  var b = document.getElementById("speakBtn");
  if (b) b.textContent = "🔊 Read this to me";
}
function speakCard() {
  if (!canSpeak) return;
  if (speaking) { stopSpeaking(); return; }
  var card = document.querySelector("#app .card");
  if (!card) return;
  var parts = [];
  card.querySelectorAll("h2, h3, p, li, .help, .tip, label.field, .msg, summary").forEach(function (el) {
    if (el.closest(".example-box, .preview-box, .print-area, .chips, #speakBtn")) return;
    var txt = (el.innerText || "").replace(/\s+/g, " ").trim();
    if (txt && parts.indexOf(txt) === -1) parts.push(txt);
  });
  var u = new SpeechSynthesisUtterance(parts.join(". ").replace(/\.\./g, "."));
  var v = pickVoice();
  if (v) u.voice = v;
  u.rate = 0.9;
  u.onend = u.onerror = function () { speaking = false; var b = document.getElementById("speakBtn"); if (b) b.textContent = "🔊 Read this to me"; };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  speaking = true;
  var b = document.getElementById("speakBtn");
  if (b) b.textContent = "■ Stop reading";
}
function addSpeakButton() {
  if (!canSpeak) return;
  var card = document.querySelector("#app .card");
  var h2 = card && card.querySelector("h2");
  if (!h2) return;
  var b = document.createElement("button");
  b.id = "speakBtn";
  b.className = "small speak no-print";
  b.setAttribute("data-action", "speak");
  b.textContent = speaking ? "■ Stop reading" : "🔊 Read this to me";
  h2.insertAdjacentElement("afterend", b);
}

function render() {

  else if (id === "vol") html = stepEntries("volunteer");

function rerenderKeepScroll() {

function goTo(n) { exampleOpen = false;

function download(bytesOrText, filename, mime) {
  var blob = new Blob([bytesOrText], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}
function copyPlain() { copyText(buildPlainText(state), "copyMsg", "plainText"); }
function copyText(text, msgId, boxId) {
  var msg = document.getElementById(msgId);
  function done(ok) {
    msg.innerHTML = ok ? '<div class="msg good">Copied. Paste it into the application with Ctrl+V (or Cmd+V on a Mac).</div>'
      : '<div class="msg warn">Could not copy automatically. Select the text in the box and copy it.</div>';
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.getElementById(boxId);
    try { ta.focus(); ta.select(); done(document.execCommand("copy")); } catch (e) { done(false); }
  }
}

document.addEventListener("input", function (ev) {
  var el = ev.target;
  var path = el.getAttribute("data-bind");
  if (path && el.tagName !== "SELECT") setPath(path, el.value);
});
document.addEventListener("change", function (ev) {
  var el = ev.target;
  if (el.getAttribute("data-action") === "jump") { goTo(parseInt(el.value, 10)); return; }
  var path = el.getAttribute("data-bind");
  if (path && el.tagName === "SELECT") { setPath(path, el.value); if (el.getAttribute("data-rerender")) rerenderKeepScroll(); return; }
  var cpath = el.getAttribute("data-bind-check");
  if (cpath) { setPath(cpath, el.checked); rerenderKeepScroll(); return; }
  if (el.id === "loadFile" && el.files && el.files[0]) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        state = mergeState(JSON.parse(reader.result)); exampleMode = false;
        dirty = false;
        goTo(1);
      } catch (e) {
        document.getElementById("loadMsg").innerHTML = '<div class="msg bad">That file could not be opened. Choose a file saved by this tool.</div>';
      }
    };
    reader.readAsText(el.files[0]);
  }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Enter" && ev.target.id === "customSkill") { ev.preventDefault(); document.querySelector('[data-action="addCustomSkill"]').click(); }
});
document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-action]");
  if (!el || el.tagName === "SELECT") return;
  var a = el.getAttribute("data-action");
  var list = el.getAttribute("data-list");
  var i = parseInt(el.getAttribute("data-i"), 10);
  switch (a) {
    case "next": goTo(step + 1); break;
    case "prev": goTo(step - 1); break;
    case "goStep": goTo(i); break;
    case "speak": speakCard(); break;
    case "toggleExample": showExample = !showExample; rerenderKeepScroll(); break;
    case "draftLetter":
      if (t(state.letter.text) && !confirm("Replace what is in the letter box with a new draft?")) break;
      state.letter.text = draftLetter(state); dirty = true; rerenderKeepScroll(); break;
    case "downloadLetter":
      if (!t(state.letter.text)) { alert("Write or draft your letter first."); break; }
      download(buildLetterDocxBytes(state), fileBaseName(state, "Cover Letter") + ".docx", "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
      break;
    case "printLetter":
      if (!t(state.letter.text)) { alert("Write or draft your letter first."); break; }
      rerenderKeepScroll(); window.print(); break;
    case "copyLetter": copyText(state.letter.text, "letterMsg", "letterText"); break;
    case "openFile": document.getElementById("loadFile").click(); break;
    case "addEntry": state[list].push(newEntry()); dirty = true; rerenderKeepScroll(); break;
    case "removeEntry":
    case "removeItem":
      if (confirm("Remove this section?")) { state[list].splice(i, 1); dirty = true; rerenderKeepScroll(); }
      break;
    case "moveUp":
      var tmp = state[list][i - 1]; state[list][i - 1] = state[list][i]; state[list][i] = tmp; dirty = true; rerenderKeepScroll(); break;
    case "addBullet": state[list][i].bullets.push(""); dirty = true; rerenderKeepScroll(); break;
    case "removeBullet": state[list][i].bullets.splice(parseInt(el.getAttribute("data-j"), 10), 1); dirty = true; rerenderKeepScroll(); break;
    case "useSuggestion":
      var e = state[list][i];
      var b = JOBS[e.type].bullets[parseInt(el.getAttribute("data-k"), 10)];
      if (e.bullets.indexOf(b) === -1) {
        var emptyAt = e.bullets.indexOf("");
        if (emptyAt !== -1) e.bullets[emptyAt] = b; else e.bullets.push(b);
      }
      dirty = true; rerenderKeepScroll(); break;
    case "fillEmployer": state[list][i].employer = el.getAttribute("data-value"); dirty = true; rerenderKeepScroll(); break;
    case "toggleSkill":
      var s = el.getAttribute("data-skill"), at = state.skills.indexOf(s);
      if (at === -1) state.skills.push(s); else state.skills.splice(at, 1);
      dirty = true; rerenderKeepScroll(); break;
    case "addCustomSkill":
      var box = document.getElementById("customSkill"), v = t(box.value);
      if (v && state.skills.indexOf(v) === -1) state.skills.push(v);
      dirty = true; rerenderKeepScroll();
      var nb = document.getElementById("customSkill"); if (nb) nb.focus();
      break;
    case "toggleStrength":
      var st = el.getAttribute("data-strength"), arr = state.summaryHelp.strengths, pos = arr.indexOf(st);
      if (pos !== -1) arr.splice(pos, 1); else if (arr.length < 3) arr.push(st);
      else { alert("You can pick up to three. Tap one you picked to remove it first."); }
      dirty = true; rerenderKeepScroll(); break;
    case "draftSummary":
      var d = draftSummary(state);
      if (!d) { alert("Answer at least one question above first."); break; }
      if (t(state.summary) && !confirm("Replace what is in the summary box with a new draft?")) break;
      state.summary = d; dirty = true; rerenderKeepScroll(); break;
    case "addCert": state.certs.push({ name: "", org: "", year: "" }); dirty = true; rerenderKeepScroll(); break;
    case "toggleCert":
      var item = CERT_GROUPS[parseInt(el.getAttribute("data-g"), 10)].items[parseInt(el.getAttribute("data-k"), 10)];
      var ci = -1;
      state.certs.forEach(function (c, idx) { if (t(c.name).toLowerCase() === item[0].toLowerCase()) ci = idx; });
      if (ci === -1) state.certs.push({ name: item[0], org: item[1], year: "" });
      else if (!t(state.certs[ci].year) || confirm("Remove " + item[0] + "?")) state.certs.splice(ci, 1);
      dirty = true; rerenderKeepScroll(); break;
    case "addEduQuick":
      state.education.push({ credential: el.getAttribute("data-cred") || "", field: "", school: el.getAttribute("data-school") || "", location: "", year: "", detail: "" });
      dirty = true; rerenderKeepScroll(); break;
    case "addEdu": state.education.push({ credential: "", field: "", school: "", location: "", year: "", detail: "" }); dirty = true; rerenderKeepScroll(); break;
    case "downloadDocx":
      if (!t(state.contact.name)) { alert("Add your name first (step 2)."); break; }
      download(buildDocxBytes(state), fileBaseName(state) + ".docx", "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
      break;
    case "print": window.print(); break;
    case "copyText": copyPlain(); break;
    case "saveJson":
      download(JSON.stringify(state, null, 2), fileBaseName(state) + " (saved work).json", "application/json");
      dirty = false; break;
    case "tryExample": startExample(1); break;
    case "toggleStepExample": exampleOpen = !exampleOpen; rerenderKeepScroll(); break;
    case "endExample": endExample(); break;
    case "clearAll":
      if (confirm("Clear everything you entered on this device? Save your work first if you want to keep it.")) {
        state = newState(); exampleMode = false; dirty = false; goTo(0);
      }
      break;
  }
});
document.addEventListener("toggle", function (ev) {
  var d = ev.target;
  if (d.tagName === "DETAILS" && d.hasAttribute("data-g")) openGroups[d.getAttribute("data-g")] = d.open;
}, true);
window.addEventListener("beforeunload", function (ev) {
  if (dirty) { ev.preventDefault(); ev.returnValue = ""; }
});
render();
</script>
</body>
</html>
