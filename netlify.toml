# Netlify build & deploy configuration for olivercrocco.com
#
# Build: Astro generates static HTML/CSS/JS into ./dist
# Deploy: Netlify serves ./dist via its global CDN

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node to a stable LTS-family version. Astro 6 requires Node ≥ 22.12.
  NODE_VERSION = "22"

# Security & SEO headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content-Security-Policy (enforcing). Every script is emitted as an external
    # /_astro/ file (see astro.config.mjs `build.assetsInlineLimit`), so `script-src
    # 'self'` covers them all with no per-script hashes — and stays correct as the
    # site grows. style-src keeps 'unsafe-inline' for the many inline style
    # attributes (style injection is low-risk); Google Fonts and the OpenAlex,
    # CrossRef, and public-ORCID (reviewer contact lookup) fetches are allowlisted;
    # frame-ancestors 'none' mirrors X-Frame-Options.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.openalex.org https://api.crossref.org https://pub.orcid.org; frame-ancestors 'none'; base-uri 'self'"

# Long cache for fingerprinted assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images: shorter cache so swaps propagate within a day
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
