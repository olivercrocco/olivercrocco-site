# Netlify build & deploy configuration for olivercrocco.com
#
# Build: Astro generates static HTML/CSS/JS into ./dist
# Deploy: Netlify serves ./dist via its global CDN

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node to a stable LTS-family version. Astro 6 requires Node ≥ 22.12.
  NODE_VERSION = "22"

# Security & SEO headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP in report-only mode: it observes violations (browser console) without
    # blocking anything, so it can't break the site or the Reviewer Finder. Once
    # you've confirmed the console reports no violations, rename this key to
    # "Content-Security-Policy" to enforce it.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.openalex.org; frame-ancestors 'none'; base-uri 'self'"

# Long cache for fingerprinted assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images: shorter cache so swaps propagate within a day
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
