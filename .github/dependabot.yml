# Dependabot opens security updates only (no routine version-bump PRs), grouped
# into one pull request, so a batch of fixes takes one merge and one deploy.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
